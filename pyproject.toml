[project]
name = "postgresledger"
version = "0.0.0"  # set from the release tag by .github/workflows/publish.yml, not here
description = "Versioned PostgreSQL migrations from plain SQL, without an ORM: generated from schema.sql, tracked per database, with drift detection"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Nebojša Mrkić", email = "mrkic.nebojsa@gmail.com" }]
dependencies = [
    "python-dotenv>=1.2.4",
]
keywords = ["postgresql", "postgres", "migrations", "database-migrations", "schema", "sql", "drift", "pgschema"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Software Development :: Version Control",
]

[project.urls]
Homepage = "https://github.com/nmrkic/postgresledger"
Repository = "https://github.com/nmrkic/postgresledger"
Issues = "https://github.com/nmrkic/postgresledger/issues"
Changelog = "https://github.com/nmrkic/postgresledger/releases"

[project.scripts]
pgl = "postgresledger.cli:main"
postgresledger = "postgresledger.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
